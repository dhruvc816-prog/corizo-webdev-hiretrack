<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireTrack - Add/Edit Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">

</head>

<body>
    <div class="container mt-4">
        <h1 id="formTitle">Add Application</h1>
        <form id="appForm">
            <input type="hidden" id="id">

            <div class="mb-3">
                <label class="form-label">Company name</label>
                <input type="text" class="form-control" id="companyName" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Domain(eg. google.com)</label>
                <input type="text" class="form-control" id="domain" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Role</label>
                <input type="text" class="form-control" id="role" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Applied Date</label>
                <input type="date" class="form-control" id="appliedDate" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Status</label>
                <select class="form-select" id="status" required>
                    <option value="PENDING">PENDING</option>
                    <option value="ASSESSMENT">ASSESSMENT</option>
                    <option value="INTERVIEW">INTERVIEW</option>
                    <option value="OFFER">OFFER</option>
                    <option value="REJECTED">REJECTED</option>

                </select>
            </div>


            <div class="mb-3">
                <label class="form-label">Notes</label>
                <textarea class="form-control" id="notes"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Save</button>
            <a href="index.html" class="btn btn-secondary">Cancel</a>
        </form>
    </div>

    <script src=" js/form.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.js"></script>
</body>

</html>
